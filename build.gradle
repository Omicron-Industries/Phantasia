buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id "idea"
    id "eclipse"
    id "maven-publish"
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'com.diffplug.spotless' version '7.0.2'
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'appeng'
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdark.dev/snapshots/"
    }
    maven {
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.tterrag.registrate")
        }
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
    maven {
        url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17 }

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            sourceSet = sourceSets.main
            programArguments.addAll('--refresh-dependencies')
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
        server {
            server()
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            programArguments.addAll('--nogui', '--world', 'world-extra')
        }
        data {
            data()
            sourceSet = sourceSets.main
            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
            programArguments.addAll('--existing-mod', 'gtceu')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Fixed to mirror your working phoenixcore manifest setup
jar {
    manifest {
        attributes([
                "MixinConfigs": "phantasia.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

// Uses explicit string configurations to prevent dynamic evaluation failures
mixin {
    add sourceSets.main, 'mixins.phantasia.refmap.json'
    config 'phantasia.mixins.json'
}

apply from: "$rootDir/gradle/scripts/spotless.gradle"

dependencies {
    compileOnly("org.jetbrains:annotations:26.0.1")

    // Mixin Processor
    annotationProcessor('org.spongepowered:mixin:0.8.5:processor')

    // JEI, EMI, Jade
    modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    modRuntimeOnly("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    modImplementation("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    modRuntimeOnly("curse.maven:jade-324717:5390389")

    // GregTech and dependencies
    modCompileOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modRuntimeOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }


    modCompileOnly("curse.maven:ars-nouveau-401955:${ars_nouveau_file_id}") { transitive = false }
    modRuntimeOnly("curse.maven:ars-nouveau-401955:${ars_nouveau_file_id}") { transitive = false }

    modCompileOnly "software.bernie.geckolib:geckolib-neoforge-1.20.1:${geckolib_version}"
    modRuntimeOnly "software.bernie.geckolib:geckolib-neoforge-1.20.1:${geckolib_version}"
    modCompileOnly "top.theillusivec4.curios:curios-forge:${curios_version}"
    modRuntimeOnly "top.theillusivec4.curios:curios-forge:${curios_version}"

  //  modCompileOnly "curse.maven:multiblocked2-1104057:7415529"
  //  modRuntimeOnly "curse.maven:multiblocked2-1104057:7415529"

    modImplementation("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modImplementation("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")

    // Your working core dependency
    modCompileOnly("curse.maven:phoenixcore-1355504:8100682")

    // Embeddium Development Environment Client
    modRuntimeOnly("org.embeddedt:embeddium-1.20.1:0.3.31-beta.53+mc1.20.1") { transitive = false }
    modCompileOnly("org.embeddedt:embeddium-1.20.1:0.3.31-beta.53+mc1.20.1") { transitive = false }


    modRuntimeOnly("curse.maven:ai-improvements-233019:4578262")
    modRuntimeOnly("curse.maven:oculus-581495:6020952")

    modCompileOnly("curse.maven:ai-improvements-233019:4578262")
    modCompileOnly("curse.maven:oculus-581495:6020952")



    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'



}

tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license": mod_license,
            "mod_id": mod_id,
            "version": version,
            "mod_name": mod_name,
            "mod_url": mod_url,
            "mod_author": mod_author,
            "forge_version": forge_version.split("\\.")[0],
            "minecraft_version": minecraft_version,
            "gtceu_version": gtceu_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(17)
    options.compilerArgs << "-Aquiet=true"
}

// ── Phantasia Web Export ──────────────────────────────────────────────────────
// Extracts block textures, models, and blockstate JSONs from GTCEu + vanilla MC
// jars into docs/assets/mc/ so the GitHub Pages viewer can resolve block models.
//
// Run with:  ./gradlew extractWebTextures
// Output:    docs/assets/mc/assets/<namespace>/{blockstates,models,textures}/...
// ─────────────────────────────────────────────────────────────────────────────
tasks.register('extractWebTextures') {
    group = 'phantasia web'
    description = 'Extracts block textures/models/blockstates from ALL mod jars to docs/assets/mc/'

    dependsOn configurations.runtimeClasspath

    doLast {
        def outputDir = file("docs/assets/mc")
        outputDir.mkdirs()

        // Match assets from ANY namespace — the MC client jar arrives under an
        // internal NeoGradle name (not 'net.minecraft'), so we can't filter by
        // group.  We filter by content pattern instead, which is just as safe.
        def includes = [
            'assets/*/blockstates/**',
            'assets/*/models/block/**',
            'assets/*/models/item/**',
            'assets/*/textures/block/**',
            'assets/*/textures/item/**',
            'assets/*/textures/gui/darkened/**',
        ]

        int jarCount = 0

        // Collect every .jar on the runtime classpath (mods + MC + Forge)
        def allJars = configurations.runtimeClasspath.resolvedConfiguration
            .resolvedArtifacts.collect { it.file }.findAll { it.name.endsWith('.jar') }

        // Also walk the local Gradle cache for the minecraft client jar that
        // NeoGradle downloads but may not expose as a resolvable artifact.
        def gradleHome = gradle.gradleUserHomeDir.absolutePath
        def mcCacheDir = new File("${gradleHome}/caches/")
        if (mcCacheDir.exists()) {
            mcCacheDir.eachFileRecurse { f ->
                if (f.name.endsWith('.jar') && (f.name.contains('minecraft') || f.name.contains('client'))
                        && !f.name.contains('sources') && !f.name.contains('javadoc')) {
                    allJars << f
                }
            }
        }

        allJars.unique { it.absolutePath }.each { jarFile ->
            try {
                def matchedFiles = zipTree(jarFile).matching { include includes }
                if (!matchedFiles.empty) {
                    copy { from matchedFiles; into outputDir }
                    jarCount++
                    logger.lifecycle("[extractWebTextures] ✓ ${jarFile.name}")
                }
            } catch (Exception e) {
                logger.debug("[extractWebTextures] skip ${jarFile.name}: ${e.message}")
            }
        }

        logger.lifecycle("[extractWebTextures] Done — ${jarCount} jars → ${outputDir}")
    }
}
