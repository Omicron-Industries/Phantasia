modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"

# This is a URL to e.g. your GitHub or CurseForge issues page.
# It will appear in any crash reports this mod is directly involved in.
# issueTrackerURL="https://github.com/invalid/pleasechangeme/issues" #optional
# A list of mods - how many allowed here is determined by the individual mod loader

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    displayURL = "${mod_url}"
    # This will be displayed as your mod's logo in the Mods panel.
    # logoFile="icon.png" #optional
    # Some more fluff displayed in the Mods panel. Feel free to issue your special thanks here!
    # credits="Thanks to Mojang for making this great game" #optional
    # Some more fluff displayed in the Mods panel. Plug your stuff here!
    authors="${mod_author}"
    description = '''
Phantasia is an in-game guide system for modpack authors.
Build interactive, step-by-step tutorials for multiblock machines!
Complete with 3D scene previews, per-step block placement guidance, item requirements, and a fully in-game editor!

Optional integration with GregTech CEu and Ars Nouveau with more to come soon!
'''

    [[dependencies.${mod_id}]]
        modId = "forge"
        mandatory = true
        versionRange = "[${forge_version},)"
        ordering = "NONE"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "minecraft"
        mandatory = true
        versionRange = "[${minecraft_version},)"
        ordering = "NONE"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "gtceu"
        mandatory = false
        versionRange = "[${gtceu_version},)"
        ordering = "AFTER"
        side = "BOTH"

    [[dependencies.${mod_id}]]
    modId = "phoenixcore"
    mandatory = false
    versionRange = "[0,)"
    ordering = "NONE"
    side = "BOTH"

    [[dependencies.${mod_id}]]
    modId = "ars_nouveau"
    mandatory = false
    versionRange = "[4,)"
    ordering = "NONE"
    side = "BOTH"